name: Production CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reading-companion

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reading_buddy_test
          POSTGRES_USER: reading_buddy
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run linting
        working-directory: ./web
        run: npm run lint

      - name: Run type checking
        working-directory: ./web
        run: npm run type-check

      - name: Run unit tests
        working-directory: ./web
        run: npm run test
        env:
          NODE_ENV: test
          # PostgreSQL test database configuration
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: reading_buddy_test
          DB_USER: reading_buddy
          DB_PASSWORD: test_password
          DATABASE_URL: postgresql://reading_buddy:test_password@localhost:5432/reading_buddy_test
          # NextAuth configuration for tests
          NEXTAUTH_SECRET: test-secret-for-ci-cd-pipeline-only
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./web/coverage/coverage-final.json
          flags: unittests
          name: codecov-production
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./web
        run: |
          npm run db:setup
          npx tsx scripts/setup-test-data.ts
          npm run test:e2e
        env:
          NODE_ENV: test
          # PostgreSQL test database configuration
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: reading_buddy_test
          DB_USER: reading_buddy
          DB_PASSWORD: test_password
          DATABASE_URL: postgresql://reading_buddy:test_password@localhost:5432/reading_buddy_test
          # NextAuth configuration for tests
          NEXTAUTH_SECRET: test-secret-for-ci-cd-pipeline-only
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: https://reads.mws.web.id
          NEXT_PUBLIC_RAG_API_URL: https://rag.mws.web.id/
          # Dummy MinIO configuration for E2E tests (URLs won't be fetched)
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: test-access-key
          MINIO_SECRET_KEY: test-secret-key
          MINIO_BUCKET_NAME: test-bucket
          MINIO_USE_SSL: "false"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=main-
            type=raw,value=prod-{{date 'YYYY-MM-DD-HHmm'}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://reads.mws.web.id
            NEXT_PUBLIC_RAG_API_URL=https://rag.mws.web.id/
            MINIO_ENDPOINT=minioapi.mws.web.id
            MINIO_PORT=443
            MINIO_USE_SSL=true

      - name: Apply Production DB Migrations
        if: success() && vars.AUTO_DB_MIGRATE_PRODUCTION == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          DB_CONTAINER: reading-buddy-postgres-prod
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -

          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          REMOTE_DIR="/tmp/reading-buddy-migrations-${GITHUB_RUN_ID}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf \"$REMOTE_DIR\" && mkdir -p \"$REMOTE_DIR/migrations\""

          scp scripts/apply_sql_migrations_via_docker.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/"

          while IFS= read -r file; do
            scp "$file" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/migrations/"
          done < <(find sql/migrations -maxdepth 1 -type f -name '20*.sql' | sort)

          scp sql/deploy-migrations.txt \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            chmod +x \"$REMOTE_DIR/apply_sql_migrations_via_docker.sh\" &&
            \"$REMOTE_DIR/apply_sql_migrations_via_docker.sh\" \
              --db-container \"$DB_CONTAINER\" \
              --db-user reading_buddy \
              --db-name reading_buddy \
              --migrations-dir \"$REMOTE_DIR/migrations\" \
              --migration-manifest \"$REMOTE_DIR/deploy-migrations.txt\" &&
            rm -rf \"$REMOTE_DIR\"
          "

      - name: Trigger Komodo Procedure Deployment
        if: success()
        run: |
          PAYLOAD='{"ref":"refs/heads/main","repository":{"full_name":"${{ github.repository }}"},"pusher":{"name":"${{ github.actor }}"},"head_commit":{"message":"${{ github.event.head_commit.message }}","id":"${{ github.sha }}"}}'
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.KOMODO_PROD_WEBHOOK_SECRET }}" | sed 's/^.* //')"
          curl -X POST "${{ secrets.KOMODO_PROD_PROCEDURE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"
