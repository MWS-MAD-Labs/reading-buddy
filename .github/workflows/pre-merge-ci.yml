name: Pre-merge CI

on:
  pull_request:
    branches: [main]

# The workflow checks untrusted PR code without credentials, packages, or deployments.
permissions:
  contents: read

concurrency:
  group: pre-merge-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linting
        working-directory: web
        run: npm run lint

      - name: Run type checking
        working-directory: web
        run: npm run type-check

      - name: Run unit tests
        working-directory: web
        run: npm run test -- --run
        env:
          NODE_ENV: test
          NEXTAUTH_SECRET: test-secret-for-ci-only
          NEXTAUTH_URL: http://127.0.0.1:3000
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_USE_SSL: "false"
          MINIO_ACCESS_KEY: test-access-key
          MINIO_SECRET_KEY: test-secret-key
          MINIO_BUCKET_NAME: test-bucket

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reading_buddy_test
          POSTGRES_USER: reading_buddy
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Set up isolated test database
        working-directory: web
        run: npm run db:setup
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: reading_buddy_test
          DB_USER: reading_buddy
          DB_PASSWORD: test_password

      - name: Run end-to-end tests
        working-directory: web
        run: npm run test:e2e
        env:
          NODE_ENV: test
          CI: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: reading_buddy_test
          DB_USER: reading_buddy
          DB_PASSWORD: test_password
          DATABASE_URL: postgresql://reading_buddy:test_password@localhost:5432/reading_buddy_test
          NEXTAUTH_SECRET: test-secret-for-ci-only
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: test-access-key
          MINIO_SECRET_KEY: test-secret-key
          MINIO_BUCKET_NAME: test-bucket
          MINIO_USE_SSL: "false"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
